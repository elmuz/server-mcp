name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run --directory packages/server-management-lib pytest -q
      - run: uv run --directory apps/remote-server-mcp pytest -q
      - run: uv run --directory apps/disk-health-mcp pytest -q
      - run: uv run pymarkdown -c .pymarkdown scan .
      - run: uv run python scripts/check_md_links.py
