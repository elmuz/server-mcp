name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.5.0)"
        required: true
        type: string

permissions:
  contents: read

# Never let two releases race each other on the same index.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # PyPI uploads cannot be replaced, so the release tag must produce a working
  # image before the first upload. This mirrors the build job in image.yml; the
  # GHCR publication still happens there, on the same tag.
  container:
    name: Build and smoke-test the release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          push: false
          load: true
          tags: localhost/server-mcp:release
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/container-smoke.sh localhost/server-mcp:release

  publish:
    needs: container
    runs-on: ubuntu-latest
    # Must match the "Environment name" registered as a trusted publisher on PyPI.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC token that PyPI exchanges for a short-lived upload token
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # workflow_dispatch executes this file from the default branch but checks out
      # the requested tag, so a tag created before scripts/pypi_missing.py existed
      # has no selector. Running the old "publish every artifact" fallback is unsafe
      # for an already published version: rebuilds are not byte-reproducible, so
      # --check-url sees a different hash for the same filename and aborts. Take the
      # selector from the default branch instead, and never move the tag.
      - name: Add the PyPI artifact selector for tags that predate it
        if: ${{ !hashFiles('scripts/pypi_missing.py') }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: helper
          sparse-checkout: scripts/pypi_missing.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Verify the tag matches every package version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          status=0
          for pyproject in pyproject.toml \
            packages/server-management-lib/pyproject.toml \
            apps/remote-server-mcp/pyproject.toml \
            apps/disk-health-mcp/pyproject.toml; do
            got="$(python3 -c 'import pathlib, sys, tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["project"]["version"])' "$pyproject")"
            echo "${pyproject}: ${got}"
            if [ "${got}" != "${version}" ]; then
              echo "::error file=${pyproject}::declares ${got}, expected ${version}"
              status=1
            fi
          done
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match the checked-out version ${version}"
            status=1
          fi
          exit "${status}"

      - name: Install the workspace
        run: uv sync --locked --all-packages --all-extras

      - name: Resolve the PyPI artifact selector
        run: |
          selector=scripts/pypi_missing.py
          if [ ! -f "$selector" ]; then
            selector=helper/scripts/pypi_missing.py
          fi
          test -f "$selector" || { echo "::error::$selector not found"; exit 1; }
          echo "PYPI_SELECTOR=$selector" >> "$GITHUB_ENV"

      # PyPI uploads cannot be replaced, so the release gate runs the suite itself
      # instead of trusting a parallel CI run.
      - name: Lint, type check and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run --directory packages/server-management-lib pytest -q
          uv run --directory apps/remote-server-mcp pytest -q
          uv run --directory apps/disk-health-mcp pytest -q

      - name: Build
        run: uv build --all-packages

      # Dependency order matters: the apps require server-management-lib>=0.5,<0.6.
      #
      # The wheels and sdists are not byte-reproducible, so a rebuild of an already
      # published version has a different hash for the same filename and `--check-url`
      # rejects it instead of skipping it. Publish only the artifacts PyPI does not
      # list yet, by filename; `--check-url` stays as a second guard. Re-running a
      # partial release is then idempotent and continues where it stopped, and a
      # re-run of a finished release uploads nothing and exits 0.
      - name: Publish server-management-lib
        run: |
          python3 "$PYPI_SELECTOR" server-management-lib > "$RUNNER_TEMP/missing.txt"
          mapfile -t files < "$RUNNER_TEMP/missing.txt"
          if [ "${#files[@]}" -eq 0 ]; then echo "server-management-lib: already on PyPI"; exit 0; fi
          printf 'uploading %s\n' "${files[@]}"
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "${files[@]}"

      - name: Publish remote-server-mcp
        run: |
          python3 "$PYPI_SELECTOR" remote-server-mcp > "$RUNNER_TEMP/missing.txt"
          mapfile -t files < "$RUNNER_TEMP/missing.txt"
          if [ "${#files[@]}" -eq 0 ]; then echo "remote-server-mcp: already on PyPI"; exit 0; fi
          printf 'uploading %s\n' "${files[@]}"
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "${files[@]}"

      - name: Publish disk-health-mcp
        run: |
          python3 "$PYPI_SELECTOR" disk-health-mcp > "$RUNNER_TEMP/missing.txt"
          mapfile -t files < "$RUNNER_TEMP/missing.txt"
          if [ "${#files[@]}" -eq 0 ]; then echo "disk-health-mcp: already on PyPI"; exit 0; fi
          printf 'uploading %s\n' "${files[@]}"
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ "${files[@]}"
