name: Feature request
description: Propose a new tool, configuration option or hardening improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately avoids generic command execution. Proposals must fit the
        fixed operation catalog and the security model in docs/security-model.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the tool or option, its inputs and the exact commands it would run.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: How does the proposal keep validation, path confinement and bounded output?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
