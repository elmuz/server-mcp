[project]
name = "server-management-lib"
version = "0.2.0"
description = "Shared security, SSH/local execution, configuration and HTTP clients for the Server MCP suite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.22,<3",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "sqlparse>=0.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
server_management_lib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/server_management_lib --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["server_management_lib"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
