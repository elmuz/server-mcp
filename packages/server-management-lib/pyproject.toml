[project]
name = "server-management-lib"
version = "0.4.0"
description = "Shared security, SSH/local execution, configuration and HTTP clients for the Server MCP suite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.22,<3",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "sqlparse>=0.5",
    "pydantic>=2.12",
]

authors = [
    { name = "Alessio Elmi", email = "alessio.elmi@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "linux",
    "server-management",
    "docker",
    "homelab",
    "self-hosting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/elmuz/server-mcp"
Repository = "https://github.com/elmuz/server-mcp"
Documentation = "https://github.com/elmuz/server-mcp/tree/main/docs"
Issues = "https://github.com/elmuz/server-mcp/issues"
Changelog = "https://github.com/elmuz/server-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
server_management_lib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/server_management_lib --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["server_management_lib"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
