[project]
name = "disk-health-mcp"
version = "0.2.0"
description = "Disk health diagnostics MCP server: SMART, NVMe, ZFS, RAID and I/O metrics with manufacturer-aware severity."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "server-management-lib>=0.2,<0.3",
]

[project.scripts]
disk-health-mcp = "disk_health_mcp:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
disk_health_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks integration tests that require real SSH connection",
]
asyncio_mode = "auto"
addopts = "--cov=src/disk_health_mcp --cov-report=term-missing"

[tool.coverage.run]
source = ["disk_health_mcp"]
branch = true

[tool.coverage.report]
fail_under = 55
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "async def main",
    "await mcp.run_stdio_async",
]
