# Disk Health MCP Configuration
# Copy this file to config.yaml and update with your details

# Where commands run: "ssh" (default) or "local"
# Use "local" when the MCP server runs on the target host itself.
executor: ssh

ssh:
  # Server connection details (for host-based diagnostics)
  host: "your-server.example.com"
  port: 22
  username: "your-user"

  # Authentication: choose ONE of the following
  # Option 1: Password authentication (less secure)
  # password: "your-password"

  # Option 2: SSH key authentication (recommended)
  key_path: "~/.ssh/id_ed25519"
  # Or leave key_path/password unset to use ssh-agent and ~/.ssh/config.

  # Host key verification (do not disable on a real server)
  known_hosts: "~/.ssh/known_hosts"
  connect_timeout: 10

security:
  # The command allowlist is built into the library and cannot be extended
  # from configuration. This legacy key has no effect.
  allow_generic_commands: false

# Data sources: configure at least one
# host: SSH-based smartctl, nvme, zfs/mdadm/snapraid, mount and iostat tools
#       (includes get_snapraid_status and get_mount_status for mergerFS + SnapRAID)
host:
  enabled: true

# prometheus: Optional. Query disk metrics from Prometheus.
# smartmon_* metrics exist only when node_exporter has the smartmon collector;
# Prometheus is not required for disk health. Telegraf -> InfluxDB is the
# recommended SMART source.
prometheus:
  enabled: false
  host: "prometheus.example.com"  # hostname/IP only, no scheme or path
  port: 443
  use_https: true
  token: "your-api-token"
  query_timeout: "30s"
  # Optional: reach a loopback-only Prometheus through the configured SSH host.
  # ssh_tunnel:
  #   enabled: true
  #   remote_host: "127.0.0.1"  # from the SSH server's point of view
  #   remote_port: 9090         # defaults to prometheus.port
  #   local_host: "127.0.0.1"   # loopback only
  #   local_port: 0             # 0 = ephemeral local port

# influxdb: Query historical disk metrics from InfluxDB
influxdb:
  enabled: false
  # Mode A: HTTPS reverse proxy (SWAG, Caddy, nginx) with a read-only token.
  host: "influxdb.example.com"  # hostname/IP only, no scheme or path
  port: 443
  use_https: true
  # Mode B: keep a local SSH tunnel open and point host/port at it, or let
  # the MCP create the tunnel with the optional ssh_tunnel block below.
  database: "my-db"  # Database that holds the Telegraf measurements
  token: "your-api-token"
  query_limit: 1000  # Maximum rows returned per query
  # ssh_tunnel:
  #   enabled: true
  #   remote_host: "127.0.0.1"  # from the SSH server's point of view
  #   remote_port: 8181         # defaults to influxdb.port
  #   local_host: "127.0.0.1"   # loopback only
  #   local_port: 0             # 0 = ephemeral local port

# MCP transport. stdio is the default. Streamable HTTP is opt-in: keep the
# bind address on loopback, or set a token (prefer the MCP_HTTP_TOKEN
# environment variable over putting it in YAML).
transport:
  type: stdio            # stdio | streamable-http
  host: "127.0.0.1"
  port: 8000
  path: "/mcp"
  token: null

# Sliding-window limit for state-changing tool calls.
rate_limit:
  enabled: true
  max_calls: 10
  window_seconds: 60

# Output safety limits (applies to command output, files and query results)
output:
  max_bytes: 64000

# Append-only JSONL audit log for commands and file reads
audit:
  enabled: false
  path: "~/.local/state/disk-health-mcp/audit.jsonl"
