# Remote Server MCP Configuration
# Copy this file to config.yaml and update with your server details

# Where commands run: "ssh" (default) or "local"
# Use "local" when the MCP server runs on the target host itself.
executor: ssh

# Container CLI used by the Docker/Compose tools: "docker" (default), "podman"
# or "nerdctl". The security allowlist is the same for every runtime.
container_runtime: docker

ssh:
  # Server connection details
  host: "your-server.example.com"
  port: 22
  username: "your-username"
  
  # Authentication: choose ONE of the following
  # Option 1: Password authentication (less secure)
  # password: "your-password"
  
  # Option 2: SSH key authentication (recommended)
  key_path: "~/.ssh/id_rsa"
  # Or leave key_path/password unset to use ssh-agent and ~/.ssh/config.

  # Host key verification (do not disable on a real server)
  known_hosts: "~/.ssh/known_hosts"
  connect_timeout: 10

security:
  # Service directory base path - all operations restricted to this path
  services_path: "/srv"

  # Containers that may be managed without a matching service directory.
  # Containers belonging to a compose project below services_path do not need
  # to be listed here. Invalid names are ignored.
  allowed_containers: []
  # allowed_containers: ["watchtower", "wud"]

  # Host systemd units that get_host_service_status/get_host_service_logs may
  # inspect. These are host infrastructure services, not Docker containers.
  # Arbitrary unit names are rejected; set an empty list to disable them.
  host_units: ["telegraf", "smartd", "docker", "snapraid", "mergerfs", "smbd"]

  # Generic command execution is never implemented and the allowlist cannot be
  # extended from configuration. This legacy key has no effect.
  allow_generic_commands: false

health:
  # Absolute mount points reported by get_server_health. NAS pools are separate
  # mounts, so list every filesystem that matters (root is the default).
  disk_paths:
    - "/"
    # - "/mnt/storage"

# Database query configuration (optional)
# These sections enable read-only HTTP API queries against InfluxDB v3 and Prometheus.
# Two supported modes for each service:
#   a) HTTPS reverse proxy (SWAG, Caddy, nginx): host/port of the proxy and
#      use_https: true. The host is a hostname or IP only, never a URL.
#   b) loopback-only service: keep a local SSH tunnel open and point host/port
#      at it, or enable the optional ssh_tunnel block so the MCP creates the
#      tunnel at startup.
# Credentials are optional - leave commented if no auth is required.

influxdb:
  # enabled: false  # Set to true to enable InfluxDB query tools
  # host: "influxdb.example.com"  # hostname/IP only (no scheme or path)
  # port: 443
  # use_https: true
  # database: "my-db"  # Default database for queries
  # token: "your-api-token"  # Optional: read-only API token
  # query_limit: 1000  # Maximum rows returned per query (safety limit)
  # ssh_tunnel:
  #   enabled: true
  #   remote_host: "127.0.0.1"  # from the SSH server's point of view
  #   remote_port: 8181         # defaults to influxdb.port
  #   local_host: "127.0.0.1"   # loopback only
  #   local_port: 0             # 0 = ephemeral local port

prometheus:
  # enabled: false  # Set to true to enable Prometheus query tools
  # host: "prometheus.example.com"  # hostname/IP only (no scheme or path)
  # port: 443
  # use_https: true
  # token: "your-bearer-token"  # Optional: read-only bearer token
  # query_timeout: "30s"  # Query timeout parameter
  # ssh_tunnel:
  #   enabled: true
  #   remote_host: "127.0.0.1"  # from the SSH server's point of view
  #   remote_port: 9090         # defaults to prometheus.port
  #   local_host: "127.0.0.1"   # loopback only
  #   local_port: 0             # 0 = ephemeral local port

# MCP transport. stdio is the default. Streamable HTTP is opt-in: keep the
# bind address on loopback, or set a token (prefer the MCP_HTTP_TOKEN
# environment variable over putting it in YAML).
transport:
  type: stdio            # stdio | streamable-http
  host: "127.0.0.1"
  port: 8000
  path: "/mcp"
  token: null

# Sliding-window limit for destructive/state-changing tool calls
# (restart, stop, compose pull/up/down). Set a larger window or disable it for
# long unattended automation.
rate_limit:
  enabled: true
  max_calls: 10
  window_seconds: 60

# Output safety limits (applies to command output, files and query results)
output:
  max_bytes: 64000

# Append-only JSONL audit log for commands and file reads
audit:
  enabled: false
  path: "~/.local/state/remote-server-mcp/audit.jsonl"
