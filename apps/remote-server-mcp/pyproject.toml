[project]
name = "remote-server-mcp"
version = "0.4.0"
description = "Security-first MCP server for managing Docker services on a remote server or on the local host."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "server-management-lib>=0.3,<0.4",
]

authors = [
    { name = "Alessio Elmi", email = "alessio.elmi@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "linux",
    "server-management",
    "docker",
    "homelab",
    "self-hosting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/elmuz/server-mcp"
Repository = "https://github.com/elmuz/server-mcp"
Documentation = "https://github.com/elmuz/server-mcp/tree/main/docs"
Issues = "https://github.com/elmuz/server-mcp/issues"
Changelog = "https://github.com/elmuz/server-mcp/blob/main/CHANGELOG.md"

[project.scripts]
remote-server-mcp = "remote_server_mcp:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
remote_server_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks integration tests that require real SSH/DB access",
]
# Keep the default suite deterministic. Run integration tests explicitly with:
#   uv run pytest -m integration
addopts = "-m 'not integration' --cov=src/remote_server_mcp --cov-report=term-missing"

[tool.coverage.run]
source = ["remote_server_mcp"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
