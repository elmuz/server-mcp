# Server MCP egress policy.
#
# The MCP containers join the internal mcp-egress network. The only route out
# is mcp-egress-proxy, which applies this file. The default is deny; add only
# the destinations the configured tools need.
#
# Syntax (shared with pi-sandbox):
#   default deny
#   allow <hostname|IP|CIDR> [port]
#   deny  <hostname|IP|CIDR> [port]
#
# Hostname rules also match subdomains. Explicit deny wins over allow. The
# proxy resolves hostnames at request time, so DNS changes are picked up
# without editing this file. IPv6 is subject to the same rules.
#
# deploy/render-egress-policy.py can regenerate the allow rules from
# remote.yaml and disk.yaml. Keep this file host-owned and read-only in the
# proxy container.

default deny

# SSH target from remote.yaml and disk.yaml.
allow catafalco.example.com 22

# Metric endpoints, only when enabled in the configs.
# allow influxdb.example.com 443
# allow prometheus.example.com 443
